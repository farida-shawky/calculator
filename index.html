<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="bootstrap.min.css" />
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body>
    <section
      class="w-100 vh-100 bg-light d-flex align-items-center justify-content-center"
    >
      <div
        style="width: 23%; height: 70%"
        class="bg-white shadow-lg d-flex flex-column pt-3 align-items-center rounded-2 gap-2 p-2"
      >
        <div class="w-100 d-flex justify-content-center p-1">
          <input
            class="display form-control w-100 h-100 bg-danger text-white p-4"
            type="text"
          />
        </div>
        <div class="row w-100 h-75 d-flex justify-content-center">
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              7
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              8
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              9
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              +
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              4
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              5
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              6
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              -
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              1
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              2
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              3
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              *
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              0
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn btn-light btn-outline-dark btn-md size rounded-circle"
            >
              /
            </button>
          </div>
          <div class="col-3">
            <button
              class="delbtn btn-warning btn text-white btn-outline-dark btn-md size rounded-circle"
            >
              del
            </button>
          </div>
          <div class="col-3">
            <button
              class="btn-danger btn text-white btn-outline-dark btn-md size rounded-circle"
            >
              C
            </button>
          </div>

          <button
            class="col-12 btn-equal btn btn-outline-dark btn-success btn-md rounded-1"
          >
            =
          </button>
        </div>
      </div>
    </section>
    <script src="index.js"></script>
  </body>
</html>
